name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API tests and model checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The suite replays nine weeks of a simulated hostel, trains every model and fails
      # if a serving model does not beat its naive baseline or a forecast peeks at the future.
      - run: pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Docker image
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t katori .
      - name: Start the container with the free tier's memory and wait for it to answer
        run: |
          docker run -d --name katori -p 8000:8000 --memory=512m katori
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/api/public/summary
      - if: always()
        run: docker logs katori | tail -n 40
