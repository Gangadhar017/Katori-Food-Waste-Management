[project]
name = "katori"
version = "0.1.0"
description = "Food-waste forecasting and queue management for hostel messes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx`:DeprecationWarning",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM905"]  # FastAPI's Depends() in defaults; long lines are left to the formatter
